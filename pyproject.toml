[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcscs"
version = "0.1.0"
description = "Progressive Cosine Similarity Classification Sifting for neural-representation analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Andrew Hedman"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "networkx>=3.0",
  "matplotlib>=3.7",
  "torch>=2.0"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License"
]

[project.optional-dependencies]
dev = ["pytest>=8"]
research = ["torchvision>=0.15", "requests>=2.31", "Pillow>=9.5", "psutil>=5.9"]
benchmark = ["psutil>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
