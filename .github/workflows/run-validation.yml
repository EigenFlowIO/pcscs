name: run-validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  empirical-run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[research]"
      - name: Require frozen sample manifest
        run: |
          test -f experiments/empirical_validation/data/sample-manifest.json || {
            echo "Frozen sample-manifest.json is missing. Run freeze-validation-sample first, review it, and commit the approved manifest.";
            exit 1;
          }
      - name: Materialize exact frozen sample
        run: python experiments/empirical_validation/scripts/materialize_sample.py
      - name: Validate exact sample
        run: python experiments/empirical_validation/scripts/validate_sample.py
      - name: Run VGG16 + PCSCS empirical validation
        run: python experiments/empirical_validation/scripts/run_validation.py
      - name: Validate empirical outputs
        run: python experiments/empirical_validation/scripts/validate_results.py
      - name: Freeze environment metadata
        run: |
          python -m pip freeze > experiments/empirical_validation/results/pip-freeze.txt
          python - <<'PY'
          import json, platform, sys
          from pathlib import Path
          p = Path("experiments/empirical_validation/results/runtime.json")
          p.write_text(json.dumps({"python": sys.version, "platform": platform.platform()}, indent=2) + "\n")
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: pcscs-validation-results
          if-no-files-found: error
          retention-days: 90
          path: |
            experiments/empirical_validation/results/**
            experiments/empirical_validation/data/sample-manifest.json
            experiments/empirical_validation/config.json
